[providers]
providers = ["...", "php", "node"]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.setup]
nixPkgs = [
  "...",
  "'(php81.withExtensions (pe: pe.enabled ++ [ pe.all.gd pe.all.dom pe.all.xml pe.all.mbstring ]))'",
  "nodejs"
]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "composer install --no-interaction --prefer-dist --optimize-autoloader",
  "npm install"
]

[phases.build]
dependsOn = ["install"]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link && (if [ -f /assets/scripts/prestart.mjs ]; then node /assets/scripts/prestart.mjs /assets/nginx.template.conf /nginx.conf; else perl /assets/prestart.pl /assets/nginx.template.conf /nginx.conf; fi) && (php-fpm -y /assets/php-fpm.conf &) && nginx -c /nginx.conf"
